[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-aware-aml-triage"
version = "0.1.0"
description = "Leakage-safe transaction features and capacity-constrained AML case queues"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "matplotlib==3.11.2",
  "nbformat==5.11.1",
  "duckdb==1.5.6",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "xgboost==3.4.1",
  "shap==0.53.0",
  "river==0.26.1",
  "joblib==1.6.0",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "PyJWT==2.15.1",
  "pwdlib[argon2]==0.3.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
]

[tool.setuptools.packages.find]
include = ["backend*", "pipelines*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
